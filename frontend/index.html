<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockWise | Inventory Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div>
            <h1>StockWise</h1>
            <p>Inventory Management System</p>
        </div>
    </header>

    <main>

        <!-- Dashboard Cards -->
        <section class="dashboard">
            <div class="card">
                <h3>Total Products</h3>
                <p id="totalProducts">0</p>
            </div>

            <div class="card">
                <h3>Low Stock</h3>
                <p id="lowStock">0</p>
            </div>

            <div class="card">
                <h3>Total Inventory Value</h3>
                <p id="inventoryValue">₹0</p>
            </div>
        </section>


        <!-- Add Product -->
        <section class="panel">

            <h2>Add New Product</h2>

            <form id="productForm">

                <input
                    type="text"
                    id="productId"
                    placeholder="Product ID"
                    required
                >

                <input
                    type="text"
                    id="productName"
                    placeholder="Product Name"
                    required
                >

                <input
                    type="text"
                    id="category"
                    placeholder="Category"
                    required
                >

                <input
                    type="number"
                    id="quantity"
                    placeholder="Quantity"
                    min="0"
                    required
                >

                <input
                    type="number"
                    id="price"
                    placeholder="Price"
                    min="0"
                    step="0.01"
                    required
                >

                <button type="submit">
                    Add Product
                </button>

            </form>

        </section>


        <!-- Search -->
        <section class="panel">

            <div class="search-row">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by ID, name or category..."
                >

                <button onclick="searchProducts()">
                    Search
                </button>

                <button onclick="loadProducts()">
                    Show All
                </button>

            </div>

        </section>


        <!-- Product Table -->
        <section class="panel">

            <h2>Product Inventory</h2>

            <div id="message"></div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Product ID</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Quantity</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="productTable">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
